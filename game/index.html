<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ember Court — a duel of cinder and flame</title>
<style>
  :root {
    --felt: #1a0f0a;
    --panel: #241610;
    --panel2: #2e1c12;
    --gold: #f2c94c;
    --gold-dim: #b98a2e;
    --ember: #ff6b35;
    --red: #e5534b;
    --green: #58d68d;
    --blue: #4fa8e0;
    --text: #f5ead9;
    --muted: #c9a98c;
    --card-w: 116px;
    --card-h: 156px;
    --mini-w: 96px;
    --mini-h: 132px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0705; }
  body { font-family: "Georgia", "Times New Roman", serif; color: var(--text); }
  #viewport { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #stage {
    position: relative; width: 1280px; height: 720px; flex: none;
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(255, 107, 53, .28), transparent 60%),
      radial-gradient(ellipse 700px 420px at 50% 115%, rgba(242, 201, 76, .14), transparent 60%),
      linear-gradient(180deg, #241209 0%, #1a0f0a 45%, #160c07 100%);
    overflow: hidden;
    box-shadow: 0 0 0 1px #3a2415, 0 0 80px rgba(0,0,0,.8);
    transform-origin: center center;
    user-select: none;
  }
  /* ---------- top bar ---------- */
  #topbar {
    position: absolute; top: 0; left: 0; right: 0; height: 30px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 14px; font-size: 13px; letter-spacing: 2px; text-transform: uppercase;
    color: var(--muted); background: rgba(0,0,0,.35); border-bottom: 1px solid #3a2415;
  }
  #topbar .brand { color: var(--gold); font-weight: bold; }
  #topbar button {
    background: none; border: 1px solid #5a3a20; color: var(--muted); border-radius: 4px;
    font: inherit; font-size: 11px; padding: 2px 8px; cursor: pointer; letter-spacing: 1px;
  }
  #topbar button:hover { color: var(--gold); border-color: var(--gold); }
  /* ---------- zones ---------- */
  .zone { position: absolute; left: 0; right: 0; display: flex; align-items: center; }
  #opp-zone { top: 34px; height: 96px; }
  #opp-board-zone { top: 140px; height: 140px; justify-content: center; }
  #center-bar { top: 288px; height: 44px; justify-content: center; }
  #my-board-zone { top: 340px; height: 140px; justify-content: center; }
  #my-zone { top: 488px; height: 220px; }
  .board-row { display: flex; gap: 10px; align-items: center; justify-content: center; min-height: 132px; }
  .board-label {
    position: absolute; left: 14px; top: 6px; font-size: 11px; letter-spacing: 2px;
    text-transform: uppercase; color: var(--muted);
  }
  .board-empty { color: #6b4a30; font-style: italic; font-size: 14px; }
  /* ---------- hero panels ---------- */
  .hero {
    width: 300px; flex: none; margin-left: 14px; display: flex; gap: 10px; align-items: center;
    background: linear-gradient(180deg, var(--panel2), var(--panel));
    border: 1px solid #4a2c17; border-radius: 10px; padding: 8px 10px;
  }
  .hero.enemy { border-color: #5a2320; }
  .hero.active-turn { box-shadow: 0 0 0 2px var(--gold-dim), 0 0 18px rgba(242, 201, 76, .35); }
  .portrait {
    width: 58px; height: 58px; flex: none; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    border: 2px solid var(--gold-dim); background: radial-gradient(circle at 35% 30%, #6b3a1e, #2a1408);
  }
  .portrait svg { width: 36px; height: 36px; }
  .hero.enemy .portrait { background: radial-gradient(circle at 35% 30%, #7a2020, #2a0808); }
  .hero-info { flex: 1; min-width: 0; }
  .hero-name { font-size: 15px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hpbar { height: 16px; margin-top: 5px; background: #120806; border-radius: 8px; overflow: hidden; border: 1px solid #4a2c17; position: relative; }
  .hpbar > i { display: block; height: 100%; background: linear-gradient(90deg, #c0392b, #e5534b); transition: width .3s; }
  .hpbar span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; color: #fff; text-shadow: 0 1px 2px #000; }
  .mana-row { display: flex; align-items: center; gap: 4px; margin-top: 6px; font-size: 12px; color: var(--muted); }
  .pip { width: 11px; height: 11px; border-radius: 50%; background: #241610; border: 1px solid #4a2c17; display: inline-block; }
  .pip.full { background: radial-gradient(circle at 35% 30%, #9fd4ff, #2f7fc2); border-color: #7fb8e8; box-shadow: 0 0 6px rgba(79,168,224,.7); }
  .pip.locked { opacity: .35; }
  /* ---------- opponent hand / deck ---------- */
  .opp-hand { flex: 1; display: flex; justify-content: center; }
  .card-back {
    width: 52px; height: 74px; border-radius: 7px; margin-left: -18px;
    background: linear-gradient(135deg, #5a2320, #2a0f0c);
    border: 2px solid var(--gold-dim); box-shadow: 0 2px 6px rgba(0,0,0,.6);
    display: flex; align-items: center; justify-content: center; color: var(--gold); font-size: 22px;
  }
  .card-back:first-child { margin-left: 0; }
  .card-back svg { width: 30px; height: 30px; }
  .deck-pile {
    width: 74px; flex: none; margin-right: 14px; text-align: center; color: var(--muted); font-size: 12px;
  }
  .deck-pile .card-back { margin: 0 auto 4px; width: 56px; height: 78px; }
  /* ---------- cards ---------- */
  .card {
    position: relative; width: var(--card-w); height: var(--card-h); flex: none;
    border-radius: 9px; padding: 5px; cursor: pointer;
    background: linear-gradient(180deg, #3a2418, #221207);
    border: 2px solid #6b4a30; box-shadow: 0 4px 10px rgba(0,0,0,.6);
    transition: transform .15s ease, box-shadow .15s ease;
    font-family: Georgia, serif;
  }
  .card.mini { width: var(--mini-w); height: var(--mini-h); cursor: default; }
  .card .cost {
    position: absolute; top: -7px; left: -7px; width: 28px; height: 28px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #9fd4ff, #2f7fc2);
    border: 2px solid #dfefff; color: #fff; font-weight: bold; font-size: 15px;
    display: flex; align-items: center; justify-content: center; text-shadow: 0 1px 2px #000; z-index: 2;
  }
  .card .art {
    height: 64px; border-radius: 6px; display: flex; align-items: center; justify-content: center;
    border: 1px solid rgba(255,255,255,.14); overflow: hidden;
  }
  .card.mini .art { height: 52px; }
  .card .art svg { width: 44px; height: 44px; filter: drop-shadow(0 2px 3px rgba(0,0,0,.6)); }
  .card.mini .art svg { width: 36px; height: 36px; }
  .card .name { font-size: 12.5px; font-weight: bold; text-align: center; margin-top: 5px; line-height: 1.1; min-height: 26px; }
  .card.mini .name { font-size: 11px; min-height: 22px; }
  .card .text {
    font-size: 11px; text-align: center; color: var(--muted); font-style: italic;
    line-height: 1.15; height: 26px; margin-top: 2px; overflow: hidden;
  }
  .card.mini .text { font-size: 10px; min-height: 20px; }
  .card .atk, .card .hp {
    position: absolute; bottom: -7px; width: 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: bold; font-size: 15px; color: #fff; text-shadow: 0 1px 2px #000; z-index: 2;
  }
  .card .atk { left: -7px; background: radial-gradient(circle at 35% 30%, #f0a35e, #b35a1b); border: 2px solid #ffe1b0; }
  .card .hp { right: -7px; background: radial-gradient(circle at 35% 30%, #ff8a7a, #b02a20); border: 2px solid #ffd0c8; }
  .card.spell { border-color: #7a5aa8; }
  .card.spell .art { background: radial-gradient(circle at 50% 30%, rgba(142,124,195,.5), rgba(40,20,70,.6)); }
  .card.taunt { border-color: #c9a227; box-shadow: 0 0 0 2px #6b5312, 0 4px 10px rgba(0,0,0,.6); }
  .card.can-attack { box-shadow: 0 0 0 2px var(--green), 0 0 14px rgba(88,214,141,.55), 0 4px 10px rgba(0,0,0,.6); }
  .card.selected { transform: translateY(-16px); box-shadow: 0 0 0 3px var(--gold), 0 0 22px rgba(242,201,76,.7); }
  .card.playable { box-shadow: 0 0 0 2px rgba(242,201,76,.55), 0 4px 10px rgba(0,0,0,.6); }
  .card.cant-play { opacity: .55; filter: saturate(.5); }
  .card.targetable { animation: pulse 1s infinite; cursor: crosshair; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 2px var(--red), 0 0 10px rgba(229,83,75,.6); } 50% { box-shadow: 0 0 0 4px var(--red), 0 0 20px rgba(229,83,75,.9); } }
  .card .sick { position: absolute; left: 50%; top: 36px; transform: translateX(-50%); background: rgba(0,0,0,.72); border: 1px solid rgba(255,255,255,.25); padding: 2px 7px; border-radius: 9px; font-size: 9px; letter-spacing: 1px; color: #ddd; text-transform: uppercase; white-space: nowrap; z-index: 2; }
  .card.sick-card .atk { opacity: .45; }
  /* ---------- hand ---------- */
  #my-hand { flex: 1; display: flex; justify-content: center; align-items: flex-end; padding-bottom: 26px; height: 100%; }
  #my-hand .card { margin-left: -14px; }
  #my-hand .card:first-child { margin-left: 0; }
  #my-hand .card:hover { transform: translateY(-22px) scale(1.06); z-index: 5; }
  #my-hand .card.selected:hover { transform: translateY(-16px); }
  .hand-count { position: absolute; right: 16px; bottom: 8px; font-size: 12px; color: var(--muted); }
  /* ---------- center bar ---------- */
  #banner {
    font-size: 17px; letter-spacing: 3px; text-transform: uppercase; color: var(--gold);
    text-shadow: 0 2px 8px rgba(0,0,0,.8);
  }
  #gamelog {
    position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    font-size: 13px; color: var(--muted); font-style: italic; max-width: 560px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #end-turn {
    position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
    font: inherit; font-size: 15px; font-weight: bold; letter-spacing: 1px;
    color: #241505; background: linear-gradient(180deg, #ffe08a, var(--gold) 55%, #d9a521);
    border: 1px solid #8a6a1a; border-radius: 8px; padding: 8px 18px; cursor: pointer;
    box-shadow: 0 3px 10px rgba(0,0,0,.5);
  }
  #end-turn:hover:not(:disabled) { filter: brightness(1.08); }
  #end-turn:disabled { opacity: .45; cursor: default; }
  /* ---------- floating damage ---------- */
  .float-num {
    position: absolute; font-size: 30px; font-weight: bold; color: #ff6b5e; z-index: 40;
    text-shadow: 0 2px 4px #000, 0 0 12px rgba(229,83,75,.8); pointer-events: none;
    animation: floatUp .9s ease-out forwards;
  }
  .float-num.heal { color: var(--green); text-shadow: 0 2px 4px #000, 0 0 12px rgba(88,214,141,.8); }
  @keyframes floatUp { from { opacity: 1; transform: translate(-50%, 0); } to { opacity: 0; transform: translate(-50%, -46px); } }
  /* ---------- overlays ---------- */
  .overlay {
    position: absolute; inset: 0; z-index: 50; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    background: radial-gradient(ellipse 700px 480px at 50% 45%, rgba(20,8,4,.88), rgba(10,4,2,.96));
  }
  .overlay h1 {
    margin: 0; font-size: 72px; letter-spacing: 6px; color: var(--gold);
    text-shadow: 0 0 30px rgba(255,107,53,.55), 0 4px 0 #5a2c05, 0 8px 24px rgba(0,0,0,.9);
  }
  .overlay h2 { margin: 6px 0 0; font-size: 20px; font-weight: normal; font-style: italic; color: var(--muted); letter-spacing: 1px; }
  .overlay .rules { margin-top: 18px; font-size: 14px; color: var(--text); line-height: 1.7; max-width: 640px; }
  .overlay .rules b { color: var(--gold); }
  .btn-row { display: flex; gap: 14px; margin-top: 26px; }
  .big-btn {
    font: inherit; font-size: 18px; font-weight: bold; letter-spacing: 1px; cursor: pointer;
    color: #241505; background: linear-gradient(180deg, #ffe08a, var(--gold) 55%, #d9a521);
    border: 1px solid #8a6a1a; border-radius: 10px; padding: 12px 26px; box-shadow: 0 4px 14px rgba(0,0,0,.6);
  }
  .big-btn:hover { filter: brightness(1.08); }
  .ghost-btn {
    font: inherit; font-size: 18px; cursor: pointer; color: var(--text);
    background: rgba(255,255,255,.06); border: 1px solid #6b4a30; border-radius: 10px; padding: 12px 22px;
  }
  .ghost-btn:hover { border-color: var(--gold); color: var(--gold); }
  .overlay .record { margin-top: 18px; font-size: 13px; color: var(--muted); letter-spacing: 1px; }
  .overlay.win h1 { color: var(--gold); }
  .overlay.loss h1 { color: #b8b0a8; text-shadow: 0 0 30px rgba(120,120,120,.4), 0 4px 0 #333, 0 8px 24px rgba(0,0,0,.9); }
  .overlay .stats { margin-top: 14px; font-size: 15px; color: var(--text); line-height: 1.8; }
  .overlay .stats b { color: var(--gold); }
  #hint {
    position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); z-index: 45;
    background: rgba(0,0,0,.75); border: 1px solid var(--gold-dim); color: var(--gold);
    font-size: 14px; padding: 6px 14px; border-radius: 20px; display: none; white-space: nowrap;
  }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  /* In shot mode every transition and animation is frozen, so a frame never changes. */
  body.shot * { transition: none !important; animation: none !important; }
</style>
</head>
<body>
<div id="viewport"><div id="stage">
  <div id="topbar">
    <span class="brand">Ember Court</span>
    <span id="turn-label">A duel of cinder and flame</span>
    <span>
      <button id="btn-howto" type="button">How to play</button>
      <button id="btn-sound" type="button">Sound: on</button>
    </span>
  </div>
  <div class="zone" id="opp-zone"></div>
  <div class="zone" id="opp-board-zone"><span class="board-label">Cinder Queen’s table</span><div class="board-row" id="opp-board"></div></div>
  <div class="zone" id="center-bar">
    <div id="gamelog"></div>
    <div id="banner"></div>
    <button id="end-turn" type="button" data-action="end-turn">End Turn</button>
  </div>
  <div class="zone" id="my-board-zone"><span class="board-label">Your table</span><div class="board-row" id="my-board"></div></div>
  <div class="zone" id="my-zone"></div>
  <div id="hint"></div>
  <div id="overlay-root"></div>
  <p id="status" role="status" aria-live="polite"></p>
</div></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
